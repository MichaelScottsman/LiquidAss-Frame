<!doctype html><html><head><meta charset="utf-8"><title>lens test</title>
<style>
body{margin:0;background:#111;font:600 20px/1.3 sans-serif;color:#fff}
.stage{position:relative;width:1000px;height:420px;overflow:hidden;
 background:repeating-linear-gradient(90deg,#ff5f6d 0 40px,#ffc371 40px 80px,#36d1dc 80px 120px,#5b86e5 120px 160px)}
.stage p{position:absolute;left:40px;top:150px;font-size:44px;margin:0;color:#111}
.cap{position:absolute;left:120px;top:120px;width:700px;height:110px;border-radius:55px;
 background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.12)}
.cap2{position:absolute;left:120px;top:280px;width:300px;height:70px;border-radius:35px;
 background:rgba(255,255,255,.08);backdrop-filter:blur(20px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
</style></head><body>
<div class="stage"><p>THE QUICK BROWN FOX JUMPS OVER</p><div class="cap" id="c"></div><div class="cap2"></div></div>
<script src="../device/lgs_lens.js"></script>
<script>const L=lgsLens(); L.track(document, document.getElementById('c'), {bezel:30, refraction:46, frost:0.6, saturation:1.7, dispersion:0.12}); document.title='lens ok '+L.count();</script>
</body></html>
