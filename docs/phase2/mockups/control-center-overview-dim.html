<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Control Center (CC-M) in a dim room during a low-battery alert</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="control-center.css">
</head>
<body>
<!-- CC-M, native mode, dim evening room, during Steam's low-battery alert (right controller 9 %). The alert REPLACES ONLY the
     battery chips row (same target: opens Battery in More Controls), as a whole-fill orange capsule with a dark label (8.6:1).
     Now Playing and Return to Game stay. Laser on the alert capsule (hover: + .08 and the light spot). -->
<div class="lgk-view" data-room="lounge" data-dim>
  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="library" data-pitch="58" data-badge data-dim=".5"></div>
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="ccm" data-cc='{"alert":"low","hover":"batt","hx":"40%","hy":"50%"}'></div>
    <div class="cc-legend" data-legend='{"mode":"laser","items":[["A","Select"],["B","Close"]]}'></div>
  </div>
  <div data-wn="winbar" data-cx="960" data-y="806" data-dim=".85"></div>
  <div class="lgk-pop" style="left:0; top:904px; width:1600px; display:flex; justify-content:center; --pop-scale:1.2">
    <div class="bar2" data-bar='{"pill":{"state":"open","batt":{"mode":"num","v":82},"badge":3}}'></div>
  </div>
  <div data-wn="laser" data-to="600,304" data-from="1560,1100"></div>
</div>
<script src="window-nav-shared.js"></script>
<script src="control-center-build.js"></script>
<script src="kit.js"></script>
<script src="control-center-icons.js"></script>
</body>
</html>
