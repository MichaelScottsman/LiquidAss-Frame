<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 library catalogue (C2c): laser mode, tile menu grown from the More circle (R2)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="home-apps.css">
<style>
  /* ================================================================== C2c Library catalogue, PLAN §1 conformance (M0)
     Library styles live in this file (owned by C2c), not in home-apps.css (C2a). Same block in -library-pad.html.
     Window coordinates (1280 x 656 glass, `window` mode, PLAN §1.2). Sizes from PLAN §1.3 and CTL §5, §8.3, §10. */

  /* tabs: Steam's tab row as a segmented control (CTL §8.3, E-SEG): 64 px track, padding 2, contiguous segments
     60 tall and >= 140 wide (hit boxes abut, P-07); the visible fill is inset 2 px; selected = white .94 with a dark
     label; Steam's horizontal scroller keeps its 28 px edge fades */
  .lc-tabs { position: absolute; left: 108px; right: 108px; top: 116px; height: 64px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%); }
  .lc-tabs .lgk-seg { position: absolute; left: 0; top: 0; }
  .lc-seg { padding: 2px !important; gap: 0 !important; }
  .lc-seg > span { position: relative; isolation: isolate; height: 60px; min-width: 140px; box-sizing: border-box; padding: 0 28px; }
  .lc-seg > span.is-selected { background: transparent !important; box-shadow: none; }
  .lc-seg > span.is-selected::before { content: ""; position: absolute; inset: 2px; z-index: -1; border-radius: inherit;
    background: var(--lg-fill-selected); box-shadow: 0 2px 6px rgb(0 0 0 / .22); }
  .lc-tabs .n { font-weight: 500; color: var(--lg-text-2); margin-left: 2px; }
  .lc-tabs .is-selected .n { color: rgb(13 14 18 / .55); }
  /* Steam's tab-row arrows: 60 px plain circles (icon buttons, 80 hit), concentric with the window corner */
  .lc-arrow { position: absolute !important; top: 118px; background: transparent !important; color: var(--lg-text-2); }
  /* VR sub-filter: Steam's radio group in its stock position, centred under the tabs; the same 64 px control */
  .lc-sub { position: absolute; left: 50%; translate: -50% 0; top: 192px; }

  /* grid: Steam's geometry (172 x 258, row pitch 300). With the scrubber mounted, T1 reserves its column with
     padding-inline-end 72 on %{GridWithControls}: Steam's grid keeps 6 columns at a 189.7 px pitch (gap 17.7) */
  .lc-grid { position: absolute; inset: 0; }
  .lc-grid .ha-poster { position: absolute; width: 172px; height: 258px; border-radius: 20px; overflow: hidden; background: #1b1e25;
    box-shadow: 0 4px 10px rgb(0 0 0 / .25); }
  /* lift of the attention target (gamepad focus, or laser after 80 ms of dwell): scale 1.05, +15 mm, the P-48
     shadow for 15 mm (0.4 px and 1.2 px per mm), a soft white glow and the diagonal sheen; no outline */
  .lc-grid .ha-poster.is-lift { scale: 1.05; z-index: 5; box-shadow: 0 6px 18px rgb(0 0 0 / .50), 0 0 30px 2px rgb(255 255 255 / .16); }
  .lc-grid .ha-poster.is-lift::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; mix-blend-mode: plus-lighter;
    background: linear-gradient(155deg, rgb(255 255 255 / .22) 0, rgb(255 255 255 / .05) 30%, transparent 55%); }
  /* the source of an open menu: depth 0 while its menu is open (PLAN §1.7 rule 6), a CSS glow instead of the lift */
  .lc-grid .ha-poster.is-source { z-index: 5; box-shadow: 0 6px 18px rgb(0 0 0 / .40), 0 0 26px 2px rgb(255 255 255 / .18); }
  /* Steam's compatibility badge, shown by Steam on hover and focus only: a 36 px circle, bottom right, inset 10 */
  .lc-compat { position: absolute; z-index: 7; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    font: 800 18px/1 var(--lg-font); box-shadow: 0 2px 6px rgb(0 0 0 / .35); }
  .lc-compat.verified { background: var(--lg-green); color: #07240f; --is: 20px; }
  .lc-compat.playable { background: var(--lg-yellow); color: #1b1300; }

  /* the More circle is C1a's helper (PLAN §1.11; its look is window-nav-shared.css .wn-more): 60 visible in an
     80 hit, inside the poster's top right, inset 10; black .38 + 10 px blur over the art; white while its menu is
     open; it rides the poster's crop (no pop of its own) */

  /* letter scrubber (T3): a 60 px recessed capsule in the reserved column, x 1196-1256 (the tab arrow's column),
     y 270-610; letters 20 px Semibold from the titles' own first characters (digits = #); current letter in a 40 px
     white circle. Laser: click or drag; gamepad: passive position cue (Steam's fast-scroll stays the pad path). */
  .lc-scrub { position: absolute; right: 24px; top: 270px; width: 60px; height: 340px; border-radius: 30px; box-sizing: border-box;
    background: rgb(0 0 0 / .14); box-shadow: inset 0 2px 4px rgb(0 0 0 / .14);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0;
    font: 600 20px/1 var(--lg-font); color: var(--lg-text-2); }
  .lc-scrub > span { display: grid; place-items: center; width: 40px; height: 20px; }
  .lc-scrub > .on { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--lg-text-on-selected); }
  .lc-scrub > .dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgb(255 255 255 / .42); }
  .lc-scrub > .dot { height: 6px; }
  .lc-scrub > .on { margin: -10px 0; }

  /* the bottom ornament on library routes (PLAN §1.10, R2-2): it hugs Steam's legends like every other route
     (WN §3.4.1, built by window-nav-shared.js); the five fixed 880 px slots are only the libFixedSlots variant (off).
     In laser mode Steam's Sort & Filter pill is the toolbar row's trailing group (data-trail), not an ornament member. */

  /* the tile menu: Steam's capsule menu, 6 actions on this device (developer mode) -> WN's compact layout
     (PLAN §1.12): 60 visible on a contiguous 64 pitch, label inline, 400 wide, Cancel a 60 quiet capsule (R2-5).
     Install is Steam's emphasis action: blue whole fill. */
  .lc-menu { width: 400px; z-index: 30; }
  .lc-menu .cancel { --s: 60px; }
  .lc-menu .lgk-row.install { background: linear-gradient(180deg, rgb(255 255 255 / .16), rgb(255 255 255 / 0) 60%), var(--lg-tint-primary); }
  .lc-menu .lgk-row.is-hover::after { --lift: .08; --spot: .12; }

  /* annotation tags (mockup only, not UI) */
  .lc-note { position: absolute; z-index: 60; font: 600 15px/20px ui-monospace, Consolas, monospace; color: #10131a; background: #ffe27a;
    padding: 1px 7px; border-radius: 5px; box-shadow: 0 2px 6px rgb(0 0 0 / .3); white-space: nowrap; }
</style>
</head>
<body>

    <!-- the More circle of the menu's source (C1a helper; white while its menu is open) -->
    <span class="wn-more is-open" style="left:335px; top:280px" data-dz="0" data-id="more" data-tier="C1a 20-more.js: capture-phase click, host onMenuButton (fallback vgp_onmenu)"><i data-i="more"></i></span>
    <!-- Steam's tile menu grown from the More circle: GP §3.4 placement (above does not fit; right, 16 px from the
         poster, centred on it, clamped to the 108-628 modal box and kept 12 px clear of the ornament, so 110-616).
         +10 mm, non-interactive (PLAN §1.7) -->
    <div class="lgk-glass wn-menu compact lc-menu" data-mat="thick" data-lens style="left:421px; top:110px; --dz:10" data-dz="10" data-id="tile-menu" data-tier="Steam's capsule menu: T1 compact slab + T2 anchor (gated: WN AT-11, GP AT-MENU) + T4 +10 mm">
