<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — game page, title view over a bright hero (T1 fallback: fixed .65 under the text column and the controls band, on-art labels .80)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="game-pages.css">

</head>
<body>
<!-- Worst case for legibility: a sunlit snowfield hero (assets/hero-bright.jpg, 1920 x 620 like Steam's
     library_hero) and a logo PNG with no shadow (assets/logo-bright.png), both from make-bright-hero.py.
     T1 fallback: fixed .65 under the text column and the controls band, on-art labels .80. Checked by legibility-check.py (AT-LEGIBLE prototype). -->
<div class="lgk-view" data-room="lounge" data-tab="library" data-fc="steam" data-bar="idle">
  <div class="lgk-overlay" style="left:320px; top:66px" data-gp="title" data-state="installed" data-focus="play" data-vr="1"
       data-hero="img:assets/hero-bright.jpg" data-logo="img:assets/logo-bright.png" data-chip="VR Supported"
       data-syn="Carve a frozen mountain at dawn with up to four friends. Every run is rebuilt from today's weather."
       data-stats="Last Played|Sep 14;Play Time|31.5 hours" data-dim=".65,.65,.45" data-cloud="1" data-foot="A:Select|B:Back"></div>
</div>
<script src="kit.js"></script>
<script src="game-pages.js"></script>
</body>
</html>
