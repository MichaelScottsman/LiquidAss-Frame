<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Settings: System › About, Change Hostname alert (flat, depth 0)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="lgk-view" data-room="lounge">

  <!-- the tab bar darkens while a dialog is up (window-nav §5.3); it stays operable -->
  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="steam settings" data-dim=".5"></div>

  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass st-win" data-mat="window" data-dz="0" data-tier="T5 window cover (T1: smoky tint + edge cues)">
      <div data-st="sidebar" data-sel="system"></div>
      <div data-st="toolbar" data-back data-title="About"></div>
      <div class="st-scroll top">
        <div class="st-col" style="top:116px">
          <div class="st-sh first">About</div>
          <div class="st-plat">
            <div class="st-r first"><span class="lab">Hostname</span><span class="lgk-btn capsule">steamframe</span></div>
            <div class="st-r"><span class="lab">OS Name</span><span class="val">SteamOS</span></div>
            <div class="st-r"><span class="lab">Codename</span><span class="val">holo</span></div>
            <div class="st-r"><span class="lab">Variant</span><span class="val">steamframe</span></div>
            <div class="st-r last"><span class="lab">Version</span><span class="val">3.8.12</span></div>
          </div>
        </div>
      </div>
      <!-- Steam's own modal overlay, restyled to black .35 in both modes (PLAN §1.8). It is in Steam's texture, so it dims the
           sidebar, the toolbar and the page together; the t1 tint is not used for in-window modals -->
      <div class="st-dim"></div>
    </div>

    <!-- the alert (window-nav §5.3): Steam's GenericConfirmDialog card as thick glass, 640 px, radius 44, buttons in Steam's order.
         It holds a destructive button (Change & Restart restarts the device), so it stays flat at depth 0 in every profile
         (PLAN §1.7 rule 4): in native mode a flat `thick` plate, never a crop. The destructive confirm is a red whole fill at rest
         with a dark label (S19, CC §7). Gamepad mode: Steam's default focus (unchanged, S6) on the text field, the one ring -->
    <div class="lgk-glass wn-alert" data-mat="thick" data-lens style="left:320px; top:150px; width:640px; --dz:0; z-index:8" data-dz="0" data-tier="flat thick plate at the window plane (destructive: never popped)">
      <div class="t">Change Hostname</div>
      <div class="b">This name identifies your Steam Frame on your network. Steam Frame restarts to apply it.</div>
      <div class="lgk-search is-focus" style="margin-top:24px; padding-left:24px; padding-right:10px">
        <span class="ph" style="color:var(--lg-text-1)">steamframe<span style="display:inline-block; width:2.5px; height:28px; margin-left:2px; vertical-align:-5px; background:var(--lg-blue); border-radius:2px"></span></span>
        <span class="lgk-btn circle" style="--s:44px; background:rgb(255 255 255 / .16)"><i data-i="xmark" style="--is:22px"></i></span>
      </div>
      <div class="btns">
        <span class="lgk-btn capsule">Cancel</span>
        <span class="lgk-btn capsule st-danger confirm">Change &amp; Restart</span>
      </div>
    </div>
    <!-- the ornament stays lit with the dialog's legends (window-nav §5.3): only A and B, so the quiet legend -->
    <div data-st="legend" data-mode="pad" data-legends="A:Select|B:Cancel"></div>
  </div>

  <div data-wn="bar" data-cx="960" data-y="904"></div>
</div>
<script src="settings-shared.js"></script>
<script src="settings-icons.js"></script>
<script src="window-nav-shared.js"></script>
<script src="kit.js"></script>
</body>
</html>
