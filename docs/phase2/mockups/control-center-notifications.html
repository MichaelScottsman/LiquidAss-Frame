<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Control Center (CC-M): the Now tile turns into the notification list, in place</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="control-center.css">
</head>
<body>
<!-- "3 Notifications" swaps the Now tile's content for the list (a `page` transition inside the tile). The tile keeps its size
     (360 x 524 px): nothing grows outside the box, so no clip rect or window edge can cut it. Steam's own list items and handlers
     render the cards (CC8). Pinned items first, then "Earlier". Laser on the friend-request card. -->
<div class="lgk-view" data-room="lounge">
  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="library" data-pitch="58" data-badge data-dim=".5"></div>
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="ccm" data-cc='{"now":"stack","hover":"n2","hx":"62%","hy":"45%"}'></div>
    <div class="cc-legend" data-legend='{"mode":"laser","items":[["A","Select"],["B","Back"]]}'></div>
  </div>
  <div data-wn="winbar" data-cx="960" data-y="806" data-dim=".85"></div>
  <div class="lgk-pop" style="left:0; top:904px; width:1600px; display:flex; justify-content:center; --pop-scale:1.2">
    <div class="bar2" data-bar='{"pill":{"state":"open","batt":{"mode":"num","v":82},"badge":3}}'></div>
  </div>
  <div data-wn="laser" data-to="636,330" data-from="1560,1100"></div>
</div>
<script src="window-nav-shared.js"></script>
<script src="control-center-build.js"></script>
<script src="kit.js"></script>
<script src="control-center-icons.js"></script>
</body>
</html>
