<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Control Center (CC-M) opened with the gamepad: first focus on Wi-Fi</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="control-center.css">
</head>
<body>
<!-- CC-M opened with A on the status pill. Focus lands on Wi-Fi (first focus) in the MAIN window's navigation tree, the tree
     agents can traverse today. Gamepad focus follows PLAN §1.4: + .28 uniform, a .16 spot in the upper third, the control's own
     arc x1.5, no scale; Wi-Fi is a blue (coloured) fill, so an outer glow 0 0 18px 2px white .30 carries the state (VP P-16).
     The laser is not in use: SteamVR hides the window-bar row; the tab bar stays (S9) and is darkened during the modal.
     Steam's footer legend shows the focused control's actions: only A and B, so it is the quiet legend, with glyph badges
     (gamepad mode, VP P-26). -->
<div class="lgk-view" data-room="lounge">
  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="library" data-pitch="58" data-badge data-dim=".5"></div>
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="ccm" data-cc='{"focus":"wifi"}'></div>
    <div class="cc-legend" data-legend='{"mode":"pad","items":[["A","Select"],["B","Close"]]}'></div>
  </div>
  <div class="lgk-pop" style="left:0; top:904px; width:1600px; display:flex; justify-content:center; --pop-scale:1.2">
    <div class="bar2" data-bar='{"pill":{"state":"open","batt":{"mode":"num","v":82},"badge":3}}'></div>
  </div>
</div>
<script src="window-nav-shared.js"></script>
<script src="control-center-build.js"></script>
<script src="kit.js"></script>
<script src="control-center-icons.js"></script>
</body>
</html>
