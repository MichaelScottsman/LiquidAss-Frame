<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Add a Friend (one floating card, no window)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="social-media.css">
<style>
  .card { left: 280px; top: 40px; width: 720px; height: 672px; --r: 44px; }
  .card > * { position: absolute; }
  .code { left: 40px; top: 240px; width: 640px; height: 112px; border-radius: 24px; background: var(--lg-fill-thick); box-shadow: inset 0 2px 5px rgb(0 0 0 / .26); }
  .invp { left: 40px; top: 412px; width: 640px; height: 80px; border-radius: 30px; background: var(--lg-fill-regular); }
  .inv { left: 40px; width: 640px; height: 80px; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 16px; box-sizing: border-box; border-radius: 30px; }
  .inv .nm { font: 600 24px/1.25 var(--lg-font); }
  .inv .pr { font: 500 18px/1.3 var(--lg-font); color: var(--lg-text-2); }
  .inv .acts { margin-left: auto; display: flex; align-items: center; gap: 24px; }      /* 24 px clear between 60 px targets */
</style>
</head>
<body>
<!-- Concept: docs/phase2/concepts/social-media.md §3.5 (revision 3, PLAN §1.2, §1.6). Route /invites, glass mode windowless: the window
     glass is off and the page is one `panel` plate (native: glassd plate; CSS-only: the CSS plate, black .58 + white .16 -> .04).
     Everything lives inside it, so nothing sits outside a cover: Steam's header Back and the collapsed search circle in the card's
     top corners, the footer legend inside its bottom band. The invite row's Block / Accept / Ignore are Steam's own DialogButtons
     (module 71251, probe P5), in DOM order. Laser mode (labels only in the legend); the code field holds Steam's default focus from
     arrival, so it shows the field ring. OK is the screen's one primary (70 px capsule). Code and names are invented. -->
<div class="lgk-view" data-room="studio" data-tab="friends" data-chrome="bar">
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass card sm-cssplate" data-mat="panel" data-dz="0" data-id="card" data-tier="glass mode windowless: panel plate (T5) / CSS plate (T1)">
      <span class="lgk-btn circle" style="left:24px; top:24px" data-id="back"><i data-i="chevron-left"></i></span>
      <span class="lgk-btn circle" style="left:636px; top:24px" data-id="search"><i data-i="search"></i></span>
      <div class="t-title2" style="left:0; right:0; top:35px; text-align:center">Add a Friend</div>
      <div class="t-subhead v2" style="left:40px; top:104px; width:640px">Enter your friend's Friend Code to invite them to connect.</div>
      <!-- Steam's input (default focus on arrival: the one ring) and OK, side by side so Right still reaches OK -->
      <div class="lgk-search is-focus" style="left:40px; top:148px; width:464px" data-id="field"><span class="ph t-num" style="font-size:26px">Friend Code</span></div>
      <span class="lgk-btn capsule lg primary" style="left:528px; top:145px; width:152px" data-id="ok">OK</span>
      <!-- Your Friend Code: a recessed platter, large tabular digits, caption in title case -->
      <div class="code">
        <div class="t-num" style="position:absolute; left:28px; top:18px; font:700 40px/1.1 var(--lg-font); letter-spacing:.02em">27182818</div>
        <div style="position:absolute; left:28px; top:70px; font:500 18px/1.3 var(--lg-font); color:var(--lg-text-2)">Your Friend Code</div>
      </div>
      <!-- incoming invites (Steam's %{IncomingInvites} > %{InvitesRow}): the row is a Focusable with Steam's three DialogButtons -->
      <div style="left:40px; top:378px; font:600 22px/1 var(--lg-font); color:var(--lg-text-2)">Pending Invites <span style="color:var(--lg-text-3); font-weight:500">1</span></div>
      <div class="invp"></div>
      <div class="inv lgk-row" style="top:412px" data-id="invite-row">
        <div class="sm-ava" data-st="online"><div class="lgk-art" data-art="avatar:9:TB"></div></div>
        <div style="display:flex; flex-direction:column"><span class="nm">Theo Brandt</span><span class="pr">2 mutual friends</span></div>
        <div class="acts">
          <span class="lgk-btn circle" data-id="block"><i data-i="xmark-circle" style="--is:26px; color:var(--lg-red)"></i></span>
          <span class="lgk-btn capsule is-hover" style="--hx:72%; --hy:45%" data-id="accept">Accept</span>
          <span class="lgk-btn capsule" data-id="ignore">Ignore</span>
        </div>
      </div>
      <!-- the legend inside the card's bottom band (Steam's #Footer at overlay y 628-712 = card y 588-672): A/B only, so quiet -->
      <div data-sm-orn="A:Select|B:Back" data-mode="laser" data-top="588"></div>
    </div>
  </div>
  <div data-wn="laser" data-to="1114,560" data-from="1640,1100"></div>
</div>
<script src="kit.js"></script>
<script src="social-media.js"></script>
<script src="window-nav-shared.js"></script>
</body>
</html>
