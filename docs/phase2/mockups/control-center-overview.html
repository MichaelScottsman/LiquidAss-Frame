<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Control Center (CC-M, native): the window becomes three glass plates over the room</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="control-center.css">
</head>
<body>
<!-- CC-M, native mode (glassd running). While Control Center is open the main window's route is `windowless` (PLAN §1.2):
     Steam's page layers fade out, the window cover's phase goes to 0, and the three tiles and the close circle are glassd
     PLATES (PLAN §1.6, G1) drawn at the window plane, so every tile frosts the ROOM (there is no window behind them any more).
     Depth 0 (PLAN §1.7); the plates' contact shadow and the room seen between them carry the separation.
     Steam's footer legend stays (PLAN §1.10): only A and B -> a quiet legend; laser mode -> no glyph badges.
     Tiles are main-window px at 1:1 (the overlay is Steam's 1280 x 720 texture at view (320, 66)). -->
<div class="lgk-view" data-room="lounge">

  <!-- tab-bar ornament (frame.menu, C1a): darkened while a modal is up, still clickable; navigating closes Control Center -->
  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="library" data-pitch="58" data-badge data-dim=".5"></div>

  <!-- Steam's main window texture: route content hidden, Control Center rendered by our T3 view (Steam modal) -->
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="ccm" data-cc='{"hover":"vol","hx":"63%","hy":"50%","vol":0.55}'></div>
    <div class="cc-legend" data-legend='{"mode":"laser","items":[["A","Select"],["B","Close"]]}'></div>
  </div>

  <!-- SteamVR's window-bar row (shown with the laser) and the dashboard bar (13 cm nearer): the status pill is white while CC is open -->
  <div data-wn="winbar" data-cx="960" data-y="806" data-dim=".85"></div>
  <div class="lgk-pop" style="left:0; top:904px; width:1600px; display:flex; justify-content:center; --pop-scale:1.2">
    <div class="bar2" data-bar='{"pill":{"state":"open","batt":{"mode":"num","v":82},"badge":3}}'></div>
  </div>

  <!-- laser on the Volume slider: the knob appears under the pointer, the value follows it; the pointer proxy is native-only (S16) -->
  <div data-wn="laser" data-to="1001,470" data-from="1560,1100"></div>
</div>
<script src="window-nav-shared.js"></script>
<script src="control-center-build.js"></script>
<script src="kit.js"></script>
<script src="control-center-icons.js"></script>
</body>
</html>
