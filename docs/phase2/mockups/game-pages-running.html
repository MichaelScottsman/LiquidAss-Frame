       only on focus or hover; its tooltip sits ABOVE it (P3's layer, data-lgs-tip="above"; under gamepad focus at once,
       data-lgs-tip-pad="now"), so the tab row stays visible. Legend: only A and B, a quiet legend (PLAN §1.10). -->
  <div class="lgk-overlay" style="left:320px; top:66px" data-gp="title" data-state="running" data-focus="stop" data-tip="stop"
       data-private="1" data-cloud="1" data-dim=".46,.40,.35" data-foot="A:Stop|B:Back"></div>
</div>
