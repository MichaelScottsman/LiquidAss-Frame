<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — game page, game running (Resume, Stop focused, tooltip above)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="game-pages.css">
</head>
<body>
<div class="lgk-view" data-room="lounge" data-tab="library" data-fc="steam" data-bar="running">
  <!-- Running (Steam path): Resume in the same green capsule; Stop is the next circle, red only on focus;
       its tooltip sits ABOVE it (under gamepad focus it shows at once), so the tab row stays visible. -->
  <div class="lgk-overlay" style="left:320px; top:66px" data-gp="title" data-state="running" data-focus="stop" data-tip="stop"
       data-private="1" data-cloud="1" data-dim=".46,.40,.35" data-foot="A:Stop|B:Back"></div>
</div>
<script src="kit.js"></script>
<script src="game-pages.js"></script>
</body>
</html>
