<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — People: the friend menu</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="social-media.css">
<style>
  /* PLAN §1.12: 6 actionable items -> the compact layout (60 px visible on a contiguous 64 px pitch, inline header line),
     440 wide (Steam's longest label, "Find Games to Play Together", needs it at 24 px), 500 tall: it fits Steam's 520 px modal box (y 108-628) without scrolling. Placed by GP §3.4's order
     (above, right, left, centred): above does not fit, so 16 px right of the source, clamped to the modal box. */
  .sm-fmenu { left: 492px; top: 128px; width: 440px; z-index: 5; }
  .sm-fmenu .lgk-row { white-space: nowrap; }
</style>
</head>
<body>
<!-- Concept: docs/phase2/concepts/social-media.md §3.2 (revision 3, PLAN §1.12, §1.7). Route /chat, FRIEND-OPTIONS state, laser mode.
     Names and art are invented. The friend menu grows out of the row's More circle (white while its menu is open) and is anchored
     beside it (T2 translate). Depth +10 mm as a non-interactive in-place crop (default profile; click-safe for 60 px rows);
     +30 mm interactive only in the wearer profile (flag interactivePops). The legend holds only A/B while the menu is open, so the
     ornament is the quiet legend (glass mode window: in the margin). Menus never dim the window (PLAN §1.8). -->
<div class="lgk-view" data-room="lounge" data-tab="friends" data-chrome="bar">
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div data-sm-people="menu"></div>

    <div class="lgk-glass lgk-menu compact sm-fmenu" data-mat="thick" data-lens style="--dz:10" data-dz="10" data-id="menu"
         data-tier="T1 in-page thick slab · T4 crop +10 mm, interactive:false · T5 thick slab under the crop">
      <div class="sm-menu-hdr inline">Rin Sato</div>
      <div class="lgk-row"><span class="lead"><i data-i="bubble"></i></span>Send Message</div>
      <div class="lgk-row"><span class="lead"><i data-i="headset"></i></span>Start Voice Chat</div>
      <div class="gap" style="height:6px"></div>
      <div class="lgk-row is-hover" style="--hx:66%; --hy:62%" data-id="menu-hover"><span class="lead"><i data-i="person"></i></span>View Profile<span class="trail"><i data-i="external"></i></span></div>
      <div class="lgk-row"><span class="lead"><i data-i="controller"></i></span>Find Games to Play Together</div>
      <div class="gap" style="height:6px"></div>
      <div class="lgk-row"><span class="lead"><i data-i="arrows-lr"></i></span>Trading<span class="trail"><i data-i="chevron-right"></i></span></div>
      <div class="lgk-row"><span class="lead"><i data-i="person-gear"></i></span>Manage<span class="trail"><i data-i="chevron-right"></i></span></div>
      <span class="lgk-btn capsule sm-cancel">Cancel</span>
    </div>
  </div>
  <!-- laser on View Profile (hover: + white .08 and the light spot; hover never moves Steam's focus, PLAN §1.4) -->
  <div data-wn="laser" data-to="1090,404" data-from="1640,1100"></div>
</div>
<script src="kit.js"></script>
<script src="social-media.js"></script>
<script src="window-nav-shared.js"></script>
</body>
</html>
