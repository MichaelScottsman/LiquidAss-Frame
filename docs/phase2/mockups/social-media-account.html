<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Account (your profile page)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="social-media.css">
<style>
  .idcard { position: absolute; left: 260px; top: 100px; width: 760px; height: 160px; border-radius: 30px; overflow: hidden; background-size: cover; background-position: 50% 40%; }
  .idcard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(0 0 0 / .55), rgb(0 0 0 / .15) 70%, rgb(0 0 0 / .35)); }
  .idcard > * { position: absolute; z-index: 1; }
  .tile { position: absolute; top: 466px; width: 240px; height: 156px; border-radius: 30px; background: var(--lg-fill-thin); box-sizing: border-box; padding: 20px 22px; }
  .tile .lbl { position: absolute; left: 22px; top: 80px; font: 600 22px/1.2 var(--lg-font); white-space: nowrap; }
  .tile .sub { position: absolute; left: 22px; right: 18px; top: 108px; font: 500 18px/1.2 var(--lg-font); color: var(--lg-text-2); }
  .tile .ext { position: absolute; right: 20px; top: 22px; --is: 22px; color: var(--lg-text-3); }
</style>
</head>
<body>
<!-- Concept: docs/phase2/concepts/social-media.md §3.4 (revision 3, PLAN §1). Route /account, glass mode window-full (1280 x 720).
     Name, code and art are invented. Gamepad mode: focus on Do Not Disturb, a single-control row, so the row carries the focus
     (+ white .28, spot in the upper third, its arc; pill inset 6) and the switch is lifted (CTL C-D14); the separator next to the
     lit row is hidden. Nested route: Back is a thin circle, search the collapsed magnifier. The legend holds only A/B, so it is
     the quiet legend inside the glass (PLAN §1.10), with glyph badges because the mode is gamepad (VP P-26). -->
<div class="lgk-view" data-room="lounge" data-tab="none" data-chrome="bar">
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass sm-win full" data-mat="window" data-dz="0" data-id="window" data-tier="glass mode window-full (720): T5 window cover / T1 smoky tint">
      <span class="lgk-btn circle sm-back" data-id="back"><i data-i="chevron-left"></i></span>
      <span class="lgk-btn circle sm-mag" data-id="search"><i data-i="search"></i></span>

      <div class="sm-scroll" style="left:0; top:96px; width:1280px; height:536px; -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 12px, #000 calc(100% - 20px), transparent 100%)">
       <div style="position:absolute; left:0; top:-96px; width:1280px" data-id="column">
        <!-- Field #1: the animated profile background stays content; the avatar is a decorative crop at +10 mm once the hole
             treatment (G2) and an off-axis hv pass (PLAN §1.7 rule 3: it lies over video); 0 mm until then -->
        <div class="idcard lgk-art" data-art="hero-clean:6:" data-id="idcard">
          <div class="sm-ava" data-st="online" style="--av:112px; left:28px; top:24px" data-dz="10" data-tier="decorative crop +10, gated on G2 + off-axis hv (0 until then)" data-id="avatar"><div class="lgk-art" data-art="avatar:5:NR"></div></div>
          <div style="left:168px; top:38px; font:700 38px/1.15 var(--lg-font); letter-spacing:-.015em">Nova Reyes</div>
          <div style="left:168px; top:88px; font:500 20px/1.3 var(--lg-font); color:var(--lg-text-2)">Online</div>
          <!-- a control over media: clear glass (black .32 + blur) on the card's dimming gradient (PLAN §1.6) -->
          <span class="lgk-btn capsule sm-clear" style="right:28px; top:50px; position:absolute" data-id="viewprofile">View Profile<i data-i="external" style="--is:22px"></i></span>
        </div>

        <!-- grouped platter: Your Status (pop-up button) and Do Not Disturb (switch at visionOS proportions, 66 x 40) -->
        <div class="sm-platter" style="left:260px; top:276px; width:760px" data-id="platter">
          <div class="lgk-row sm-prow pill"><div><div class="lbl">Your Status</div><div class="sub">How you appear to other people</div></div>
            <div class="end"><span class="lgk-btn sm-popup" data-id="status">Online<i data-i="chevron-down"></i></span></div></div>
          <div class="lgk-row sm-prow pill is-focus" style="--hx:50%; --hy:26%" data-id="dnd"><div><div class="lbl">Do Not Disturb</div><div class="sub">Disables all chat notifications</div></div>
            <div class="end"><span class="lgk-toggle lift" data-id="toggle"></span></div></div>
        </div>

        <!-- FatButtonRow stays a row of three (D-pad); tiles leave for web pages, so they carry an external glyph -->
        <div class="tile" style="left:260px" data-id="tile-funds"><span class="sm-chip" style="background:var(--lg-green)"><i data-i="wallet"></i></span><i data-i="external" class="ext"></i>
          <span class="lbl">Add Funds</span><span class="sub"></span></div>
        <div class="tile" style="left:520px"><span class="sm-chip" style="background:var(--lg-blue)"><i data-i="eye-slash"></i></span><i data-i="external" class="ext"></i>
          <span class="lbl">Privacy Settings</span><span class="sub">Profile, Games, Inventory, Etc</span></div>
        <div class="tile" style="left:780px"><span class="sm-chip" style="background:var(--lg-gray)"><i data-i="person"></i></span><i data-i="external" class="ext"></i>
          <span class="lbl">Account Details</span><span class="sub">Store, Security, Family, Devices</span></div>
       </div>
      </div>
    </div>

    <!-- quiet legend: Steam's #Footer inside the 720 glass (no capsule, no slab); items keep their 60 px size and stay clickable -->
    <div data-sm-orn="A:Select|B:Back" data-mode="pad"></div>
  </div>
</div>
<script src="kit.js"></script>
<script src="social-media.js"></script>
<script src="window-nav-shared.js"></script>
</body>
</html>
