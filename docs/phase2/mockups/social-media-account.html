<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Account (your profile page)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="social-media.css">
<style>
  .idcard { position: absolute; left: 260px; top: 100px; width: 760px; height: 160px; border-radius: 30px; overflow: hidden; background-size: cover; background-position: 50% 40%; }
  .idcard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(0 0 0 / .55), rgb(0 0 0 / .15) 70%, rgb(0 0 0 / .35)); }
  .idcard > * { position: absolute; z-index: 1; }
  .tile { position: absolute; top: 466px; width: 240px; height: 156px; border-radius: 30px; background: var(--lg-fill-thin); box-sizing: border-box; padding: 20px 22px; }
  .tile .lbl { position: absolute; left: 22px; top: 80px; font: 600 22px/1.2 var(--lg-font); white-space: nowrap; }
  .tile .sub { position: absolute; left: 22px; right: 18px; top: 108px; font: 500 18px/1.2 var(--lg-font); color: var(--lg-text-2); }
  .tile .ext { position: absolute; right: 20px; top: 22px; --is: 22px; color: var(--lg-text-3); }
  .dd { height: 60px; padding: 0 18px 0 24px; gap: 12px; font-size: 22px; }
</style>
</head>
<body>
<!-- Concept: docs/phase2/concepts/social-media.md §3.4 (revision 2). Route /account. Name, code and art are invented.
     Nested route: Back is a thin circle, search is the collapsed magnifier (window-nav hero variant). The legend here only ever holds
     A/B hints, so the glass runs to 720 and the hints sit inside the window's bottom edge (quiet legend, no extra chrome row). -->
<div class="lgk-view" data-room="lounge" data-tab="none" data-chrome="bar">
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass sm-win full" data-mat="window" data-dz="0" data-tier="T5 window (1280 x 720) / T1 tint">
      <span class="lgk-btn circle sm-back"><i data-i="chevron-left"></i></span>
      <span class="lgk-btn circle sm-mag"><i data-i="search"></i></span>

      <div class="sm-scroll" style="left:0; top:96px; width:1280px; height:536px; -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 12px, #000 calc(100% - 20px), transparent 100%)">
       <div style="position:absolute; left:0; top:-96px; width:1280px">
        <!-- Field #1: the animated profile background stays content; avatar pops +10 mm (in-place crop) -->
        <div class="idcard lgk-art" data-art="hero-clean:6:">
          <div class="sm-ava" data-st="online" style="--av:112px; left:28px; top:24px" data-dz="10" data-tier="T4 crop +10 (not a target)"><div class="lgk-art" data-art="avatar:5:NR"></div></div>
          <div style="left:168px; top:38px; font:700 38px/1.15 var(--lg-font); letter-spacing:-.015em">Nova Reyes</div>
          <div style="left:168px; top:88px; font:500 20px/1.3 var(--lg-font); color:var(--lg-text-2)">Online</div>
          <span class="lgk-btn capsule" style="right:28px; top:50px; position:absolute; background:rgb(255 255 255 / .18)">View Profile<i data-i="external" style="--is:22px"></i></span>
        </div>

        <!-- grouped platter: Your Status (dropdown) and Do Not Disturb (toggle at visionOS proportions) -->
        <div class="sm-platter" style="left:260px; top:276px; width:760px">
          <div class="lgk-row sm-prow"><div><div class="lbl">Your Status</div><div class="sub">How you appear to other people</div></div>
            <div class="end"><span class="lgk-btn capsule dd">Online<i data-i="chevron-down" style="--is:22px"></i></span></div></div>
          <div class="lgk-row sm-prow is-focus" style="--hx:50%; --hy:40%"><div><div class="lbl">Do Not Disturb</div><div class="sub">Disables all chat notifications</div></div>
            <div class="end"><span class="lgk-toggle"></span></div></div>
        </div>

        <!-- FatButtonRow stays a row of three (D-pad); tiles leave for web pages, so they carry an external glyph -->
        <div class="tile" style="left:260px"><span class="sm-chip" style="background:var(--lg-green)"><i data-i="wallet"></i></span><i data-i="external" class="ext"></i>
          <span class="lbl">Add Funds</span><span class="sub"></span></div>
        <div class="tile" style="left:520px"><span class="sm-chip" style="background:var(--lg-blue)"><i data-i="eye-slash"></i></span><i data-i="external" class="ext"></i>
          <span class="lbl">Privacy Settings</span><span class="sub">Profile, Games, Inventory, Etc</span></div>
        <div class="tile" style="left:780px"><span class="sm-chip" style="background:var(--lg-gray)"><i data-i="person"></i></span><i data-i="external" class="ext"></i>
          <span class="lbl">Account Details</span><span class="sub">Store, Security, Family, Devices</span></div>
       </div>
      </div>
    </div>

    <!-- quiet legend: Steam's #Footer inside the glass (no capsule, no slab); items keep their 60 px size and stay clickable -->
    <div class="sm-band" data-sm-legend="A:Select:quiet|B:Back:quiet"></div>
  </div>
</div>
<script src="kit.js"></script>
<script src="social-media.js"></script>
</body>
</html>
