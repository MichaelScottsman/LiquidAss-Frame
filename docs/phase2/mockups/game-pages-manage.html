<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — game page, Manage menu grown beside the gear</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="game-pages.css">
</head>
<body>
<div class="lgk-view" data-room="lounge" data-tab="library" data-fc="steam" data-bar="idle">
  <div class="lgk-overlay" style="left:320px; top:66px" data-gp="title" data-state="installed" data-focus="none" data-open="manage"
       data-private="1" data-cloud="1" data-dim=".46,.40,.35" data-foot="A:Select|B:Cancel">
    <!-- rule 3: the gear ends at x 993, so the slab does not fit on its right (993 + 16 + 360 > 1256); it opens on
         its LEFT, 16 px from the gear (x 537-897), clamped to y 108-628. The gear stays visible and white. -->
    <div class="lgk-glass lgk-menu gp-menu" data-mat="thick" data-lens style="left:537px; top:108px; width:360px; --dz:30; z-index:5" data-dz="30" data-tier="T1+T2 anchor (beside, left)">
      <div class="hdr">Starfall Drift</div>
      <div class="lgk-row"><span class="lead"><i data-i="star2"></i></span>Add to Favorites</div>
      <div class="lgk-row"><span class="lead"><i data-i="folder-plus"></i></span>Add to<i data-i="chevron-right" class="chev"></i></div>
      <div class="lgk-row is-hover" style="--hx:58%; --hy:50%"><span class="lead"><i data-i="wrench"></i></span>Manage<i data-i="chevron-right" class="chev"></i></div>
      <div class="lgk-row"><span class="lead"><i data-i="terminal"></i></span>Developer<i data-i="chevron-right" class="chev"></i></div>
      <div class="gap" style="height:2px"></div>
      <div class="lgk-row"><span class="lead"><i data-i="sliders"></i></span>Properties…</div>
      <span class="cancel">Cancel</span>
    </div>
  </div>
  <svg style="position:absolute; inset:0; width:1920px; height:1080px; pointer-events:none; z-index:40" viewBox="0 0 1920 1080">
    <defs><linearGradient id="beam" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#dbe8ff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient></defs>
    <polygon points="1700,1095 1712,1095 1066,416 1064,416" fill="url(#beam)" opacity=".5"/>
  </svg>
  <div class="lgk-laser-dot" style="left:1065px; top:416px"></div>
</div>
<script src="kit.js"></script>
<script src="game-pages.js"></script>
</body>
</html>
