<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Settings: System › Updates (drill-down sub-view, gamepad on Apply)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="lgk-view" data-room="lounge">

  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="steam settings"></div>

  <!-- ============ /settings/system, sub-view "Updates" (Steam's Updates + Beta Participation sections; the rest of the page is display:none) -->
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass st-win" data-mat="window" data-dz="0" data-tier="T5 window (T1: smoky tint)">

      <div data-st="sidebar" data-sel="system"></div>
      <!-- detail toolbar: Back circle (returns to System; B does the same), inline title = the drill-down row's label -->
      <div data-st="toolbar" data-back data-title="Updates"></div>

      <div class="st-scroll top">
        <div class="st-col" style="top:116px">
          <!-- Steam's "Updates" header is represented by the inline title; Steam's own rows follow -->
          <div class="st-plat">
            <div class="st-r first two">
              <span class="st-chip sm" data-c="orange"><i data-si="reset"></i></span>
              <span class="lab">Software Updates<span class="desc">Update available: SteamOS 3.8.12</span></span>
              <span class="lgk-btn capsule primary is-focus" style="--s:60px; --hx:46%; --hy:30%">Apply</span>
            </div>
            <div class="st-r last"><span class="lab">Update available:</span><span class="val">SteamOS 3.8.12</span></div>
          </div>
          <div class="st-sh">Beta Participation</div>
          <div class="st-plat">
            <div class="st-r first"><span class="lab">OS Update Channel</span><span class="st-pop">Stable<i data-si="updown"></i></span></div>
            <div class="st-r last"><span class="lab">Steam Client Update Channel</span><span class="st-pop">Stable<i data-si="updown"></i></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div data-wn="frame" data-cx="960" data-y="806" data-dim=".72"></div>
  <div data-wn="bar" data-cx="960" data-y="904"></div>
  <div data-wn="pill" data-cx="960" data-y="1018"></div>
</div>
<script src="settings-shared.js"></script>
<script src="settings-icons.js"></script>
<script src="window-nav-shared.js"></script>
<script src="kit.js"></script>
</body>
</html>
