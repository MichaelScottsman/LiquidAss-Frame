<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Settings: System › Updates (drill-down sub-view, gamepad on Apply)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="lgk-view" data-room="lounge">

  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="steam settings"></div>

  <!-- ============ /settings/system, sub-view "Updates" (Steam's Updates + Beta Participation sections; the rest of the page is
       display:none, exemption E-DRILL). Gamepad mode, focus on Apply -->
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass st-win" data-mat="window" data-dz="0" data-tier="T5 window cover (T1: smoky tint + edge cues)">

      <div data-st="sidebar" data-sel="system"></div>
      <!-- detail toolbar: Back circle (returns to System; B does the same), inline title = the drill-down row's label -->
      <div data-st="toolbar" data-back data-title="Updates"></div>

      <div class="st-scroll top">
        <div class="st-col" style="top:116px">
          <!-- Steam's own section header stays visible (no node is hidden or moved; the toolbar title is our decorative copy) -->
          <div class="st-sh first">Updates</div>
          <div class="st-plat">
            <!-- single-control row: the row carries the focus (+.28, spot, top highlight); the primary is "lifted" with the
                 outer glow, because light cannot brighten a coloured fill (VP P-16). Primary = 70 px capsule (PLAN §1.3),
                 popped +10 mm as a non-interactive crop with a tinted slab (PLAN §1.7) -->
            <div class="st-r first two is-focus">
              <span class="st-chip sm" data-c="orange" style="font:800 20px/1 var(--lg-font)">!</span>
              <span class="lab">Software Updates<span class="desc">Update available: SteamOS 3.8.12</span></span>
              <span class="lgk-btn capsule lg primary st-glow" style="padding:0 34px" data-dz="10" data-tier="primary 70 px: +10 mm non-interactive crop + tinted slab (G3)">Apply</span>
            </div>
            <div class="st-r last"><span class="lab">Update available:</span><span class="val">SteamOS 3.8.12</span></div>
          </div>
          <div class="st-sh">Beta Participation</div>
          <div class="st-plat">
            <div class="st-r first"><span class="lab">OS Update Channel</span><span class="st-pop">Stable<i data-si="updown"></i></span></div>
            <div class="st-r last"><span class="lab">Steam Client Update Channel</span><span class="st-pop">Stable<i data-si="updown"></i></span></div>
          </div>
        </div>
      </div>
    </div>
    <!-- quiet legend in the margin; gamepad mode, so the glyph badges show (VP P-26) -->
    <div data-st="legend" data-mode="pad" data-legends="A:Select|B:Back"></div>
  </div>

  <div data-wn="bar" data-cx="960" data-y="904"></div>
</div>
<script src="settings-shared.js"></script>
<script src="settings-icons.js"></script>
<script src="window-nav-shared.js"></script>
<script src="kit.js"></script>
</body>
</html>
