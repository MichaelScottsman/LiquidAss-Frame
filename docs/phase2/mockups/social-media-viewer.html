<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Screenshot viewer (Photos)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="social-media.css">
<style>
  .photo { position: absolute; left: 57px; top: 0; width: 1166px; height: 656px; border-radius: 40px; overflow: hidden; background-size: cover; background-position: center; }
  .meta { position: absolute; left: 92px; top: 584px; font: 500 18px/1.3 var(--lg-font); color: rgb(255 255 255 / .82); text-shadow: 0 1px 3px rgb(0 0 0 / .5); }
  .arrow { position: absolute; top: 298px; }
  .ov { box-shadow: 0 4px 14px rgb(0 0 0 / .28) !important; }
</style>
</head>
<body>
<!-- Concept: docs/phase2/concepts/social-media.md §3.7 (revision 3, PLAN §1). Route /media/item/screenshot/:id, glass mode window (656),
     controls shown (Y), laser mode. The photo fills the glass; the window tint behind it rises to .45. Controls are clear glass over a
     35 % dimming band and stay at 0 mm: a crop of a clear control would lift the photo's pixels with it, so this screen has no pops
     (crop budget 0; PLAN §1.7 rule 3). Toolbar circles and capsules keep 24 px clear between them (PLAN §1.3). Search is the collapsed
     magnifier circle. The LB/RB glyph badges under the arrows show in gamepad mode only (VP P-26), so not here. The room dim behind
     the window (SM-D6) is behind the flag roomDim, off: glassd cannot draw outside the Steam texture yet (P9 G7). -->
<div class="lgk-view" data-room="lounge" data-tab="media" data-chrome="bar">
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass sm-win" data-mat="window" data-dz="0" data-id="window" data-tier="glass mode window (656), tint .45 behind the photo" style="--lgk-tint:12 12 14; --lgk-tint-a:.45">
      <div class="photo lgk-art" data-art="hero-clean:2:" data-id="photo">
        <div class="sm-media-dim-top"></div><div class="sm-media-dim-bot"></div>
      </div>
      <!-- Steam's Metadata line, kept verbatim, as an over-media caption -->
      <div class="meta">Taken: Oct 5, 2026 @ 5:29 PM - 123 KB</div>
    </div>

    <!-- toolbar row over the photo: Back, then Steam's ScreenshotFormActions (trash, Share; DOM order kept) and the collapsed search
         circle at the top-right. Clear glass over media, 0 mm, CSS shadow only. -->
    <span class="lgk-glass lgk-btn circle sm-back ov" data-mat="clear" data-lens style="background:rgb(0 0 0 / .18)" data-dz="0" data-id="back"><i data-i="chevron-left"></i></span>
    <span class="lgk-glass lgk-btn circle ov" data-mat="clear" data-lens style="position:absolute; left:944px; top:24px; background:rgb(0 0 0 / .18)" data-id="trash"><i data-i="trash" style="color:var(--lg-red)"></i></span>
    <span class="lgk-glass lgk-btn capsule is-hover ov" data-mat="clear" data-lens style="position:absolute; left:1028px; top:24px; width:144px; background:rgb(0 0 0 / .18); --hx:70%; --hy:40%" data-id="share"><i data-i="share"></i>Share</span>
    <span class="lgk-glass lgk-btn circle sm-mag ov" data-mat="clear" data-lens style="background:rgb(0 0 0 / .18)" data-id="search"><i data-i="search"></i></span>

    <!-- previous / next (Steam's %{ChangeItem}): visible whenever the controls are, 60 px clear circles -->
    <div class="arrow" style="left:16px"><span class="lgk-glass lgk-btn circle ov" data-mat="clear" data-lens style="position:relative; background:rgb(0 0 0 / .2)" data-id="prev"><i data-i="chevron-left"></i></span></div>
    <div class="arrow" style="left:1204px"><span class="lgk-glass lgk-btn circle ov" data-mat="clear" data-lens style="position:relative; background:rgb(0 0 0 / .2)" data-id="next"><i data-i="chevron-right"></i></span></div>

    <div data-sm-orn="Y:Hide|A:Select|B:Back" data-mode="laser" data-mat="clear" data-style="background:rgb(0 0 0 / .22)"></div>
  </div>
  <div data-wn="laser" data-to="1478,136" data-from="1700,1100"></div>
</div>
<script src="kit.js"></script>
<script src="social-media.js"></script>
<script src="window-nav-shared.js"></script>
</body>
</html>
