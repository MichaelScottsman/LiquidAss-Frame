<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 window-nav: the window at rest (Library)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<style>
  .tabs { position: absolute; left: 40px; top: 120px; }
  .tabs .n { font-weight: 500; color: var(--lg-text-2); margin-left: 2px; }
  .tabs .is-selected .n { color: rgb(13 14 18 / .55); }
  .grid { position: absolute; left: 0; top: 212px; right: 0; bottom: 0; }
  .grid .lgk-poster { width: 220px; height: 330px; }
  .chip-update { position: absolute; left: 14px; top: 14px; height: 32px; padding: 0 14px; border-radius: 16px; display: grid; place-items: center;
                 background: var(--lg-blue); font: 600 18px/1 var(--lg-font); }
  .dl { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 44px; border-radius: 22px; background: rgb(0 0 0 / .52);
        display: flex; align-items: center; gap: 10px; padding: 0 16px; font: 600 18px/1 var(--lg-font); }
  .dl .bar { flex: 1; height: 8px; border-radius: 4px; background: rgb(255 255 255 / .22); overflow: hidden; }
  .dl .bar > i { display: block; height: 100%; width: 62%; border-radius: 4px; background: #fff; }
</style>
</head>
<body>
<div class="lgk-view" data-room="lounge">

  <!-- tab-bar ornament: Steam's VR main menu (frame.menu), always visible, Library selected -->
  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="library" data-badge></div>

  <!-- Steam's main window, 1280 x 720 overlay at 1:1 -->
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass wn-win" data-mat="window" data-dz="0" data-tier="T5 window cover (T1: tint)">
      <div class="grid wn-fade-bottom">
        <div class="lgk-poster lgk-art" data-art="poster:0:Starfall Drift" style="left:42px; top:0"></div>
        <div class="lgk-poster lgk-art is-focus" data-art="poster:1:Hollow Peaks" style="left:286px; top:0" data-dz="15" data-tier="T4 lift"></div>
        <div class="lgk-poster lgk-art" data-art="poster:2:Neon Orchard" style="left:530px; top:0">
          <div class="dl"><i data-i="download" style="--is:22px"></i><span class="bar"><i></i></span><span class="t-num">62%</span></div>
        </div>
        <div class="lgk-poster lgk-art" data-art="poster:3:Tidebreaker" style="left:774px; top:0"><span class="chip-update">Update</span></div>
        <div class="lgk-poster lgk-art" data-art="poster:4:Lumen Vale" style="left:1018px; top:0"></div>
        <div class="lgk-poster lgk-art" data-art="poster:8:Echo Station" style="left:42px; top:354px"></div>
        <div class="lgk-poster lgk-art" data-art="poster:6:Ironwood" style="left:286px; top:354px"></div>
        <div class="lgk-poster lgk-art" data-art="poster:7:Paper Comets" style="left:530px; top:354px"></div>
        <div class="lgk-poster lgk-art" data-art="poster:5:Glasswing" style="left:774px; top:354px"></div>
        <div class="lgk-poster lgk-art" data-art="poster:9:Deep Field" style="left:1018px; top:354px"></div>
      </div>
      <div class="wn-edge-top" style="height:118px; opacity:.6"></div>
      <div data-wn="toolbar" data-back="root" data-title="Library" data-search="idle"></div>
      <div class="lgk-seg tabs">
        <span class="is-selected">All Games <span class="n t-num">350</span></span>
        <span>Great on Frame <span class="n t-num">21</span></span>
        <span>Ready to Play <span class="n t-num">68</span></span>
        <span>Collections <span class="n t-num">9</span></span>
        <span>Non-Steam <span class="n t-num">54</span></span>
      </div>
    </div>

    <!-- bottom ornament: Steam's footer legend as real buttons; straddles the glass edge by 28 px -->
    <div data-wn="ornament" data-legends="X:Filter|*Y:Sort By|menu:Options|A:Select|B:Back"></div>
  </div>

  <!-- SteamVR frame controls under the window (systemui), idle-dim kept -->
  <div data-wn="frame" data-cx="960" data-y="806" data-dim=".72"></div>
  <!-- dashboard bar (system concept) and the window-bar pill (SteamVR grab handle) -->
  <div data-wn="bar" data-cx="960" data-y="904"></div>
  <div data-wn="pill" data-cx="960" data-y="1018"></div>

  <div data-wn="laser" data-to="1028,737" data-from="1690,1100"></div>
</div>
<script src="window-nav-shared.js"></script>
<script src="kit.js"></script>
</body>
</html>
