<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 home-apps: a collection opened as a folder (the real VR collection), gamepad mode, card open</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="home-apps.css">
</head>
<body>
<!-- Gamepad mode (data-lgs-vr-mode="gamepad"): the card's glyph badges show (VP P-26); no laser, so SteamVR's
     window-bar row is hidden (WN §3.5.1). Five of the 13 games on page 1 are not installed (real data):
     desaturated art + the cloud badge (concept §3.3). -->
<div class="lgk-view" data-room="studio" data-lgs-vr-mode="gamepad">
  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="home"></div>
  <div class="lgk-overlay" style="left:320px; top:66px">
    <!-- top row on the 108 px toolbar row's centre line (y 54): Back, the folder's title on the room, Show in Library, search -->
    <div data-id="back" class="lgk-glass ha-back" data-mat="liquid" data-lens data-dz="0" data-tier="Steam %{BackContainer} · plate · history back to Home"><i data-i="chevron-left"></i></div>
    <div data-id="title" style="position:absolute; left:0; right:0; top:32px; text-align:center; font:700 30px/44px var(--lg-font); letter-spacing:-.01em; text-shadow:0 1px 3px rgb(0 0 0 / .6), 0 0 14px rgb(0 0 0 / .4)">VR</div>
    <div data-id="showinlib" class="lgk-glass ha-wn" data-mat="liquid" data-lens style="right:104px" data-dz="0" data-tier="T3 · plate → /library/collection/&lt;id&gt;"><i data-i="library"></i>Show in Library</div>
    <div data-id="search" class="lgk-glass ha-find" data-mat="liquid" data-lens data-dz="0" data-tier="Steam %{SearchAndTitleContainer} · circle variant · plate"><i data-i="search"></i></div>

    <div data-id="cell-1" class="ha-cell not-installed" style="--x:304px; --y:196px">
      <div data-id="disc-1" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="751630" data-name="After The Fall"></div></div>
      <span class="ha-cloud"><i data-i="download"></i></span>
      <div data-id="label-1" class="ha-label">After The Fall</div>
    </div>
    <div data-id="cell-2" class="ha-cell not-installed" style="--x:528px; --y:196px">
      <div data-id="disc-2" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="2320910" data-name="AMID EVIL VR"></div></div>
      <span class="ha-cloud"><i data-i="download"></i></span>
      <div data-id="label-2" class="ha-label">AMID EVIL VR</div>
    </div>
    <div data-id="cell-3" class="ha-cell is-under" style="--x:752px; --y:196px">
      <div data-id="disc-3" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="629730" data-name="Blade & Sorcery"></div></div>
      <div data-id="label-3" class="ha-label">Blade & Sorcery</div>
    </div>
    <div data-id="cell-4" class="ha-cell is-under" style="--x:976px; --y:196px">
      <div data-id="disc-4" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="963930" data-name="Contractors VR"></div></div>
      <div data-id="label-4" class="ha-label">Contractors VR</div>
    </div>
    <div data-id="cell-5" class="ha-cell not-installed" style="--x:192px; --y:384px">
      <div data-id="disc-5" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="1484280" data-name="Demeo"></div></div>
      <span class="ha-cloud"><i data-i="download"></i></span>
      <div data-id="label-5" class="ha-label">Demeo</div>
    </div>
    <div data-id="cell-6" class="ha-cell" style="--x:416px; --y:384px">
      <div data-id="disc-6" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="611670" data-name="The Elder Scrolls V: Skyrim VR"></div></div>
      <div data-id="label-6" class="ha-label">The Elder Scrolls V: Skyrim VR</div>
    </div>
    <div data-id="cell-7" class="ha-cell is-under" style="--x:640px; --y:384px">
      <div data-id="disc-7" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="1575520" data-name="Fruit Ninja VR 2"></div></div>
      <div data-id="label-7" class="ha-label">Fruit Ninja VR 2</div>
    </div>
    <!-- cell 8 (Grimlord, not installed) holds gamepad focus; after 0.8 s it has morphed into the card below -->
    <div data-id="cell-9" class="ha-cell is-under" style="--x:1088px; --y:384px">
      <div data-id="disc-9" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="2177750" data-name="Half-Life 2: VR Mod - Episode One"></div></div>
      <div data-id="label-9" class="ha-label">Half-Life 2: VR Mod - Episode One</div>
    </div>
    <div data-id="cell-10" class="ha-cell" style="--x:304px; --y:572px">
      <div data-id="disc-10" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="546560" data-name="Half-Life: Alyx"></div></div>
      <div data-id="label-10" class="ha-label">Half-Life: Alyx</div>
    </div>
    <div data-id="cell-11" class="ha-cell not-installed" style="--x:528px; --y:572px">
      <div data-id="disc-11" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="1499120" data-name="I Expect You To Die 2"></div></div>
      <span class="ha-cloud"><i data-i="download"></i></span>
      <div data-id="label-11" class="ha-label">I Expect You To Die 2</div>
    </div>
    <div data-id="cell-12" class="ha-cell" style="--x:752px; --y:572px">
      <div data-id="disc-12" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="275850" data-name="No Man's Sky"></div></div>
      <div data-id="label-12" class="ha-label">No Man's Sky</div>
    </div>
    <div data-id="cell-13" class="ha-cell" style="--x:976px; --y:572px">
      <div data-id="disc-13" class="lgk-glass ha-disc" data-mat="liquid" data-lens><div class="ha-art" data-app="555160" data-name="Pavlov VR"></div></div>
      <div data-id="label-13" class="ha-label">Pavlov VR</div>
    </div>
    <div data-id="peek-r1" class="ha-peek" style="left:1212px; top:196px"><div class="ha-art" data-app="547590"></div></div>
    <div data-id="peek-r3" class="ha-peek" style="left:1212px; top:572px"><div class="ha-art" data-app="438100"></div></div>
    <div data-id="dots" class="ha-dots" style="left:640px; top:690px"><i class="on"></i><i></i><i></i></div>

    <!-- the card, 0.8 s after gamepad focus landed on Grimlord: Install (blue, the game is not installed) with its
         X badge, More with its menu badge; a plate, +15 mm non-interactive crop in native mode. 704..1024 x 284..524 -->
    <div data-id="card" class="lgk-glass ha-card" data-mat="liquid" data-lens style="left:704px; top:284px; --dz:15" data-dz="15" data-tier="T3 card · plate + T4 crop +15 mm (non-interactive)">
      <span class="ha-hero" data-app="1910860" data-name="Grimlord" data-pos="50% 35%"></span>
      <span data-id="card-play" class="lgk-btn capsule play primary" style="background:linear-gradient(180deg, rgb(255 255 255 / .18), rgb(255 255 255 / 0) 55%), var(--lg-tint-primary)"><i data-i="download"></i>Install<span class="lgk-glyph">X</span></span>
      <span data-id="card-more" class="lgk-btn circle more"><i data-i="more"></i><span class="badge"></span></span>
      <div class="ttl">Grimlord</div>
      <div class="sub">Not installed</div>
    </div>
  </div>
  <div data-wn="bar" data-cx="960" data-y="904"></div>
</div>
<script src="../../refs/library/library.js"></script>
<script src="home-apps.js"></script>
<script src="window-nav-shared.js"></script>
<script src="kit.js"></script>
<script src="home-apps-icons.js"></script>
</body>
</html>
