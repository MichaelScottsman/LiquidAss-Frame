<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Control Center (CC-M) in CSS-only mode: tiles at the opaque end of the dial (.94)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="control-center.css">
</head>
<body>
<!-- CC-M, CSS-only (native mode off: what ships until the native gate passes, PLAN §4.3). The window content and glass are gone
     while Control Center is open (route glass mode `windowless`, PLAN §1.2), so the tiles sit over the room. CSS cannot frost the
     room, so the tiles use the opaque end of the dial (black-blue .94, PLAN §1.2): the room shows through at 6 %, unblurred.
     Nothing of the window can ghost through, because nothing of the window is drawn. No pointer proxy (native only, S16):
     SteamVR's own laser dot is visible. -->
<div class="lgk-view" data-room="lounge" data-tier="t1">
  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="library" data-pitch="58" data-badge data-dim=".5"></div>
  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="ccm" data-cc='{"hover":"vol","hx":"63%","hy":"50%","vol":0.55}'></div>
    <div class="cc-legend" data-legend='{"mode":"laser","items":[["A","Select"],["B","Close"]]}'></div>
  </div>
  <div data-wn="winbar" data-cx="960" data-y="806" data-dim=".85"></div>
  <div class="lgk-pop" style="left:0; top:904px; width:1600px; display:flex; justify-content:center; --pop-scale:1.2">
    <div class="bar2" data-bar='{"pill":{"state":"open","batt":{"mode":"num","v":82},"badge":3}}'></div>
  </div>
  <!-- laser on the Volume slider; SteamVR's own dot (no proxy in CSS-only mode) -->
  <svg style="position:absolute; inset:0; width:1920px; height:1080px; pointer-events:none; z-index:40" viewBox="0 0 1920 1080">
    <defs><linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="1560" y1="1100" x2="1001" y2="470"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#dbe8ff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient></defs>
    <polygon points="1554,1100 1566,1100 1002,470 1000,470" fill="url(#beam)" opacity=".55"/>
  </svg>
  <div class="lgk-laser-dot" style="left:1001px; top:470px"></div>
</div>
<script src="window-nav-shared.js"></script>
<script src="control-center-build.js"></script>
<script src="kit.js"></script>
<script src="control-center-icons.js"></script>
</body>
</html>
