<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — game page, Stop pressed: the Exit game alert</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="game-pages.css">
</head>
<body>
<div class="lgk-view" data-room="lounge" data-tab="library" data-fc="steam" data-bar="running">
  <div class="lgk-overlay" style="left:320px; top:66px" data-gp="title" data-state="running" data-focus="none" data-open="stop"
       data-private="1" data-cloud="1" data-dim=".46,.40,.35" data-foot="A:Select|B:Cancel">
    <div class="gp-scrim" style="left:0; top:0; width:1280px; height:656px; border-radius:54px; --a:.35; z-index:4"></div>
    <div class="lgk-glass" data-mat="thick" data-lens style="left:320px; top:204px; width:640px; height:296px; --r:44px; --dz:30; z-index:5; padding:36px 40px; box-sizing:border-box" data-dz="30" data-tier="alert: T1, T4 pop, T5 slab">
      <div style="font:700 28px/1.25 var(--lg-font); letter-spacing:-.01em">Exit game?</div>
      <div style="margin-top:4px; font:500 22px/1.32 var(--lg-font); color:var(--lg-text-2)">Any progress since your last save may be lost.</div>
      <div style="position:absolute; left:40px; right:40px; bottom:36px; display:flex; gap:24px">
        <span class="lgk-btn capsule is-focus" style="flex:1; background:linear-gradient(180deg, rgb(255 255 255 / .16), rgb(255 255 255 / 0) 60%), var(--lg-tint-danger)">Exit Game</span>
        <span class="lgk-btn capsule" style="flex:1">Cancel</span>
      </div>
    </div>
  </div>
</div>
<script src="kit.js"></script>
<script src="game-pages.js"></script>
</body>
</html>
