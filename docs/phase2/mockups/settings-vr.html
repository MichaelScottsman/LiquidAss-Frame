<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Settings: the new VR Settings page (default state, before P-S3)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="lgk-view" data-room="lounge">

  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="steam settings"></div>

  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass st-win" data-mat="window" data-dz="0" data-tier="T5 window cover (T1: smoky tint + edge cues)">
      <div data-st="sidebar" data-sel="vr" data-scroll="180"></div>
      <div data-st="toolbar"></div>

      <div class="st-scroll top">
        <div class="st-col" style="top:116px">
          <div class="st-hero"><span data-chip="vr" data-cls="md"></span><div class="t-title1">VR Settings</div></div>

          <!-- one row into SteamVR's own page (T3 Focusable; A or click = SteamClient.SteamVR.DashboardTabClicked, as the tab bar's
               VR Settings item does). Trailing laser glyph: that page is laser-only. Laser hover = + .08 and the light spot -->
          <div class="st-plat">
            <div class="st-r first last is-hover" style="--hx:56%; --hy:50%"><span class="st-chip" data-c="gray"><i data-si="headset"></i></span><span class="lab">SteamVR</span><i data-si="laser" style="--is:26px; color:var(--lg-text-2)"></i><i data-si="chevr" class="chev"></i></div>
          </div>
          <!-- English-only T3 footnote (PLAN §1.15) -->
          <div class="st-foot">SteamVR's own settings use the laser pointer. With a controller, press Left there to reach the tab bar.</div>
          <div class="st-gap20"></div>

          <!-- Steam's own Quick Access › Performance › VR components (module 862 via 51008), rendered unchanged and restyled by
               the same rules. Refresh Rate is Steam's notched slider (CTL §7.3): 7 rates, knob always shown at the current notch,
               the fill ends at its centre, bookends under the ends. Live (2026-10-07): five render; Custom Render Resolution only
               when SteamVR reports it -->
          <div class="st-plat">
            <div class="st-r first stack">
              <div class="head"><span class="lab">Refresh Rate</span><span class="val" style="font-weight:600; color:var(--lg-text-1)">90</span></div>
              <span class="st-slider notched" style="--n:6; --i:2"><span class="fill"></span><span class="tick on" style="--t:0"></span><span class="tick on" style="--t:1"></span><span class="tick" style="--t:3"></span><span class="tick" style="--t:4"></span><span class="tick" style="--t:5"></span><span class="tick" style="--t:6"></span><span class="knob"></span></span>
              <div class="ends"><span>72</span><span>144</span></div>
            </div>
            <div class="st-r last"><span class="lab">Motion Smoothing</span><i data-si="info" style="--is:26px; color:var(--lg-text-3)"></i><span class="lgk-toggle on"></span></div>
          </div>
          <div class="st-sh">Performance</div>
          <div class="st-plat">
            <div class="st-r first"><span class="lab">Show Perf Overlay in VR</span><span class="lgk-toggle"></span></div>
            <div class="st-r"><span class="lab">Record VR Performance</span><span class="lgk-toggle"></span></div>
            <div class="st-r last"><span class="lab">Record Tracking</span><span class="lgk-toggle"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div data-st="legend" data-mode="laser" data-legends="A:Select|B:Back"></div>
  </div>

  <div data-wn="winbar" data-cx="960" data-y="806" data-dim=".85"></div>
  <div data-wn="bar" data-cx="960" data-y="904"></div>
  <div data-wn="laser" data-to="1205,294" data-from="1640,1100"></div>
</div>
<script src="settings-shared.js"></script>
<script src="settings-icons.js"></script>
<script src="window-nav-shared.js"></script>
<script src="kit.js"></script>
</body>
</html>
