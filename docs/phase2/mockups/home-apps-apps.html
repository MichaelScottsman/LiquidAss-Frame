<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 home-apps: Home, Apps (the real launch list, A to Z), laser mode</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="home-apps.css">
</head>
<body>
<div class="lgk-view" data-room="studio">

  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="home"></div>

  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass ha-back" data-mat="liquid" data-lens data-dz="0"><i data-i="chevron-left"></i></div>
    <div class="lgk-glass ha-seg" data-mat="liquid" data-lens style="left:640px; translate:-50% 0" data-dz="0">
      <span>Recent</span><span>Collections</span><span class="is-selected">Apps</span>
    </div>
    <div class="lgk-glass ha-wn" data-mat="liquid" data-lens style="right:104px" data-dz="0"><i data-i="sparkle"></i>What's New</div>
    <div class="lgk-glass ha-find" data-mat="liquid" data-lens data-dz="0"><i data-i="search"></i></div>

    <!-- Apps: Steam's own "+ > Launch Program" list (useNonSteamApps + Steam's filter), A to Z.
         23 programs: the Liquid Glass switch lives only in the "+" popup (HA-10). Page 1 of 2. -->
    <div class="ha-cell" style="--x:304px; --y:196px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Camera Switch"></span></div>
      <div class="ha-label">Camera Switch</div>
    </div>
    <div class="ha-cell" style="--x:528px; --y:196px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Chromium"></span></div>
      <div class="ha-label">Chromium</div>
    </div>
    <div class="ha-cell" style="--x:752px; --y:196px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="CMake"></span></div>
      <div class="ha-label">CMake</div>
    </div>
    <div class="ha-cell" style="--x:976px; --y:196px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Desktop" data-glyph="display"></span></div>
      <div class="ha-label">Desktop</div>
    </div>
    <div class="ha-cell" style="--x:192px; --y:384px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Discover"></span></div>
      <div class="ha-label">Discover</div>
    </div>
    <div class="ha-cell" style="--x:416px; --y:384px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Dolphin"></span></div>
      <div class="ha-label">Dolphin</div>
    </div>
    <div class="ha-cell is-under" style="--x:640px; --y:384px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Firewall"></span></div>
      <div class="ha-label">Firewall</div>
    </div>
    <div class="ha-cell is-focus" style="--x:864px; --y:384px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens style="--dz:15" data-dz="15" data-tier="T3 cell · plate (occluder while popped) + T4 crop +15 mm, non-interactive"><span class="ha-prog" data-prog="Frametop Display Settings"></span></div>
    </div>
    <div class="ha-cell is-under" style="--x:1088px; --y:384px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Frametop Input Settings"></span></div>
      <div class="ha-label">Frametop Input Settings</div>
    </div>
    <div class="ha-cell" style="--x:304px; --y:572px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Frametop Remote Access" data-glyph="remote"></span></div>
      <div class="ha-label">Frametop Remote Access</div>
    </div>
    <div class="ha-cell" style="--x:528px; --y:572px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Full SBS Toggle"></span></div>
      <div class="ha-label">Full SBS Toggle</div>
    </div>
    <div class="ha-cell" style="--x:752px; --y:572px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Google Chrome"></span></div>
      <div class="ha-label">Google Chrome</div>
    </div>
    <div class="ha-cell" style="--x:976px; --y:572px">
      <div class="lgk-glass ha-disc" data-mat="liquid" data-lens><span class="ha-prog" data-prog="Half SBS Toggle"></span></div>
      <div class="ha-label">Half SBS Toggle</div>
    </div>

    <!-- the attended program's full name after 0.4 s (laser dwell here; gamepad focus does the same): a liquid
         name plate in place of its label; in native mode its own +15 mm crop over its own occluder plate -->
    <div class="lgk-glass ha-plate" data-mat="liquid" data-lens style="left:864px; top:458px; translate:-50% 0; --dz:15" data-dz="15" data-tier="T3 name plate · plate + T4 crop +15 mm">
      <span class="n">Frametop Display Settings</span>
    </div>

    <!-- next page peeks (page 2 starts with Hide/Show Screens; its row 3 starts with VLC media player) -->
    <div class="ha-peek" style="left:1212px; top:196px"><div class="lgk-glass ha-disc" data-mat="liquid" style="left:0; top:0"><span class="ha-prog" data-prog="Hide/Show Screens" data-glyph="screens"></span></div></div>
    <div class="ha-peek" style="left:1212px; top:572px"><div class="lgk-glass ha-disc" data-mat="liquid" style="left:0; top:0"><span class="ha-prog" data-prog="VLC media player"></span></div></div>

    <div class="ha-dots" style="left:640px; top:690px"><i class="on"></i><i></i></div>
  </div>

  <div data-wn="winbar" data-cx="960" data-y="806" data-dim=".85"></div>
  <div data-wn="bar" data-cx="960" data-y="904"></div>
  <div data-wn="laser" data-to="1196,470" data-from="1700,1100"></div>
</div>
<script src="../../refs/library/library.js"></script>
<script src="home-apps.js"></script>
<script src="window-nav-shared.js"></script>
<script src="kit.js"></script>
<script src="home-apps-icons.js"></script>
</body>
</html>
