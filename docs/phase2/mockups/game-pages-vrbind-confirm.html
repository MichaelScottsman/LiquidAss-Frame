<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Controller Bindings pressed with the gamepad: Steam's ConfirmModal as a visionOS alert</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="game-pages.css">
</head>
<body>
<div class="lgk-view" data-room="lounge" data-tab="library" data-fc="steam" data-bar="idle">
  <!-- Gamepad A on the Controller Bindings capsule (onOKButton) opens Steam's ConfirmModal (SR §3.6, proven) instead
       of switching straight to SteamVR's laser-only editor; a laser click goes straight through. Cancel / B returns
       focus to the capsule. Strings: title SteamVR #Controller_Bindings; body new (GQ14b); buttons Steam's own. -->
  <div class="lgk-overlay" style="left:320px; top:66px" data-gp="title" data-state="installed" data-focus="none" data-open="vrbind"
       data-private="1" data-cloud="1" data-dim=".46,.40,.35" data-foot="A:Select|B:Cancel">
    <div class="gp-scrim" style="left:0; top:0; width:1280px; height:656px; border-radius:54px; --a:.35; z-index:4"></div>
    <div class="lgk-glass" data-mat="thick" data-lens style="left:320px; top:188px; width:640px; height:328px; --r:44px; --dz:30; z-index:5; padding:36px 40px; box-sizing:border-box" data-dz="30" data-tier="ConfirmModal (T3 call) drawn as a WN alert">
      <div style="display:flex; align-items:center; gap:16px">
        <span style="display:grid; place-items:center; width:48px; height:48px; border-radius:50%; background:var(--lg-indigo); color:#fff; --is:28px"><i data-i="vrbind"></i></span>
        <div style="font:700 28px/1.25 var(--lg-font); letter-spacing:-.01em">Controller Bindings</div>
      </div>
      <div style="margin-top:14px; font:500 22px/1.36 var(--lg-font); color:var(--lg-text-2)">SteamVR's binding editor is used with the laser pointer. Back in the editor returns you to this page.</div>
      <div style="position:absolute; left:40px; right:40px; bottom:36px; display:flex; gap:24px">
        <span class="lgk-btn capsule is-focus" style="flex:1; background:linear-gradient(180deg, rgb(255 255 255 / .16), rgb(255 255 255 / 0) 60%), var(--lg-tint-primary)"><i data-i="laser"></i>Continue</span>
        <span class="lgk-btn capsule" style="flex:1">Cancel</span>
      </div>
    </div>
  </div>
</div>
<script src="kit.js"></script>
<script src="game-pages.js"></script>
</body>
</html>
