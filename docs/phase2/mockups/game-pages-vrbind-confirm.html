<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Controller Bindings pressed with the gamepad: Steam's ConfirmModal as a visionOS alert</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="game-pages.css">
</head>
<body>
<div class="lgk-view" data-room="lounge" data-tab="library" data-fc="steam" data-bar="idle">
  <!-- Flag vrBindings on (PLAN S13: built and tested, OFF by default; the capsule and its relay are C5b's).
       Gamepad A on the Controller Bindings capsule (onOKButton) opens Steam's ConfirmModal instead of switching straight
       to SteamVR's laser-only editor; a laser click goes straight through. Cancel / B returns focus to the capsule (P-21).
       Drawn as C1c's alert: 640 px, centred on the glass, thick glass, +10 mm non-interactive pop (no destructive
       button), scrim black .35 (PLAN §1.8). Strings: title SteamVR #Controller_Bindings; buttons Steam's own; the body
       is a NEW string (GQ14b), drawn only when the UI language starts with "en" (PLAN §1.15), else omitted.
       Default focus is Steam's (S6): its primary, which as a coloured fill shows focus as the outer glow (P-16). -->
  <div class="lgk-overlay" style="left:320px; top:66px" data-gp="title" data-state="installed" data-focus="none" data-open="vrbind" data-vr="1"
       data-private="1" data-cloud="1" data-dim=".46,.40,.35" data-foot="A:Select|B:Cancel">
    <div class="gp-scrim modal" style="left:0; top:0; width:1280px; height:656px; border-radius:54px; z-index:4"></div>
    <div class="lgk-glass gp-alert" data-mat="thick" data-lens style="left:320px; top:328px; translate:0 -50%; width:640px; --r:44px; --dz:10; z-index:5" data-dz="10" data-tier="C1c alert (ConfirmModal via C5b's T3); +10 mm crop">
      <div style="display:flex; align-items:center; gap:16px">
        <span style="display:grid; place-items:center; width:48px; height:48px; border-radius:50%; background:var(--lg-indigo); color:#fff; --is:28px"><i data-i="vrbind"></i></span>
        <div class="t">Controller Bindings</div>
      </div>
      <div class="b">SteamVR's binding editor is used with the laser pointer. Back in the editor returns you to this page.</div>
      <div class="btns">
        <span class="lgk-btn capsule gp-primary is-focus"><i data-i="laser"></i>Continue</span>
        <span class="lgk-btn capsule">Cancel</span>
      </div>
    </div>
    <span class="gp-flag" style="left:976px; top:-34px">flag vrBindings on (C5b); default off</span>
  </div>
</div>
<script src="kit.js"></script>
<script src="game-pages.js"></script>
</body>
</html>
