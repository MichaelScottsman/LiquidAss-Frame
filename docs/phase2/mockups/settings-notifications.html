<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Shell P2 — Settings: Notifications root (drill-down rows instead of 144 inline controls)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="window-nav-shared.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="lgk-view" data-room="lounge">

  <div data-wn="tabbar" data-right="302" data-cy="426" data-sel="steam settings"></div>

  <div class="lgk-overlay" style="left:320px; top:66px">
    <div class="lgk-glass st-win" data-mat="window" data-dz="0" data-tier="T5 window (T1: smoky tint)">
      <div data-st="sidebar" data-sel="notifications" data-scroll="930" data-focus="notifications"></div>
      <div data-st="toolbar"></div>

      <div class="st-scroll top">
        <div class="st-col" style="top:116px">
          <div class="st-hero"><span data-chip="notifications" data-cls="md"></span><div class="t-title1">Notifications</div></div>
          <!-- Steam's unheaded first group, inline -->
          <div class="st-plat">
            <div class="st-r first two"><span class="lab">Show Notification Toasts<span class="desc">Pop-ups in VR for new notifications</span></span><span class="st-pop">Always<i data-si="updown"></i></span></div>
            <div class="st-r last"><span class="lab">Play a sound when a toast is displayed</span><span class="lgk-toggle on"></span></div>
          </div>
          <div class="st-gap20"></div>
          <!-- one drill-down row per Steam section (T3, after Steam's content), labelled with that section's own header text -->
          <div class="st-plat">
            <div class="st-r first"><span class="lab">Client Notifications</span><i data-si="chevr" class="chev"></i></div>
            <div class="st-r"><span class="lab">Friend Notifications</span><i data-si="chevr" class="chev"></i></div>
            <div class="st-r"><span class="lab">Store News</span><i data-si="chevr" class="chev"></i></div>
            <div class="st-r"><span class="lab">Personal Activity</span><i data-si="chevr" class="chev"></i></div>
            <div class="st-r"><span class="lab">Wishlist Activity</span><i data-si="chevr" class="chev"></i></div>
            <div class="st-r last"><span class="lab">Developer / Game News</span><i data-si="chevr" class="chev"></i></div>
          </div>
          <!-- our rows come after all of Steam's root-visible content (D-pad order = DOM order), so Steam's last section is a
               drill-down too; its trailing value is the state of its one switch -->
          <div class="st-gap20"></div>
          <div class="st-plat">
            <div class="st-r"><span class="lab">Email Opt-out</span><span class="val">Off</span><i data-si="chevr" class="chev"></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div data-wn="frame" data-cx="960" data-y="806" data-dim=".72"></div>
  <div data-wn="bar" data-cx="960" data-y="904"></div>
  <div data-wn="pill" data-cx="960" data-y="1018"></div>
</div>
<script src="settings-shared.js"></script>
<script src="settings-icons.js"></script>
<script src="window-nav-shared.js"></script>
<script src="kit.js"></script>
</body>
</html>
